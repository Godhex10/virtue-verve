<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in — Virtue &amp; Verve admin</title>
  <meta name="theme-color" content="#03332f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2303332f'/%3E%3Cpath d='M22 28c0-14 20-14 20 0' fill='none' stroke='%23c9a96e' stroke-width='4' stroke-linecap='round'/%3E%3Crect x='14' y='27' width='36' height='24' rx='6' fill='%23c9a96e'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-page="login">
  <div class="login">
    <div class="login-art">
      <img src="../assets/images/hero.jpg" alt="">
      <div class="login-quote">
        <p>welcome back</p>
        <h2>Your shop, beautifully in hand.</h2>
      </div>
    </div>

    <div class="login-form">
      <form class="login-box" id="loginForm">
        <p class="side-logo">Virtue <span>&amp;</span> Verve</p>
        <p class="side-tag">Admin</p>
        <h1>Sign in</h1>
        <p>Manage your bags, orders and customers.</p>
        <label class="field">Email address<input type="email" name="email" autocomplete="username" required></label>
        <label class="field">Password<input type="password" name="password" autocomplete="current-password" required></label>
        <button class="btn btn-primary" type="submit"><i class="fa-solid fa-lock"></i>Sign in</button>
        <p class="preview-note"><i class="fa-solid fa-circle-info"></i><span><b>Preview.</b> Any email and password will sign you in for now. Secure login arrives with the database.</span></p>
      </form>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/admin/admin.js"></script>
</body>
</html>
